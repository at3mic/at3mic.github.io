<header class="header">
  <div class="header__inner">
    <div class="header__logo">
      {{ partial "logo.html" . }}
    </div>
    <div class="header__actions">
      {{ if len $.Site.Menus }}
        {{ partial "mobile-menu.html" . }}
      {{ end }}
      <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="theme-toggle__icon" aria-hidden="true">◐</span>
        <span class="theme-toggle__label">Theme</span>
      </button>
    </div>
    {{ if and $.Site.Params.showLanguageSelector (len $.Site.Home.AllTranslations) }}
      {{ partial "language-menu.html" . }}
    {{ end }}
  </div>
  {{ if len $.Site.Menus }}
    {{ partial "menu.html" . }}
  {{ end }}
</header>

<script>
  (() => {
    const root = document.documentElement;
    const button = document.querySelector('.theme-toggle');
    const storedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = storedTheme || (prefersDark ? 'dark' : 'light');

    const setTheme = (nextTheme) => {
      root.dataset.theme = nextTheme;
      button.setAttribute('aria-pressed', String(nextTheme === 'dark'));
      button.setAttribute('aria-label', `Switch to ${nextTheme === 'dark' ? 'light' : 'dark'} theme`);
    };

    setTheme(theme);
    button.addEventListener('click', () => {
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', nextTheme);
      setTheme(nextTheme);
    });
  })();
</script>
